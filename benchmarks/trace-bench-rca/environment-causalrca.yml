# The pinned environment of `rca/causalrca` (plans/rca-arms.md, addendum 2026-10-22, later): the
# requirements.txt of AXinx/CausalRCA_code at 21f4eb0 exactly, Python 3.9 (the one version all ten pins
# share). Never install these into the `trace-bench-rca` environment; the adapter calls this one's
# interpreter (`rankcausalrca --causalrca-python`).
#
# macOS arm64: scikit-network 0.24.0 publishes x86_64 wheels only and its source build pins numpy 1.20.0,
# which does not build on arm64, so the environment is x86_64 under Rosetta 2:
#   CONDA_SUBDIR=osx-64 conda env create -f environment-causalrca.yml
# Linux x86_64: `conda env create -f environment-causalrca.yml` as is.
# Under Rosetta 2, `import torch` as a process's first import faults; the script imports numpy first,
# and so does the runner (`tracebenchrca/causalrca_runner.py`).
name: causalrca-21f4eb0
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.20.3
  - pandas=1.3.4
  - scipy=1.7.1
  - networkx=2.6.3
  - scikit-learn=1.2.2
  - matplotlib=3.4.3
  - tqdm=4.62.3
  - requests=2.26.0
  - pip
  - pip:
      - torch==1.10.2
      - scikit-network==0.24.0
