[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-bench-rca"
version = "0.1.0"
description = "Benchmark harness: published root-cause methods and their controls scored on the trace-bench corpora through the benchmark's own scorers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pyarrow>=25.0,<26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "huggingface_hub>=0.30",
    # the benchmark: the publication branch's score-side commit. The reference harness beside this
    # directory pins a3eb104 (tag v0.3.0-score3); this directory pins fcb7ddb3, the `clear-2027`
    # merge of PR #14 that carries `tracebench.export_rca` with its extras `topology` and `spans`
    # (RUN.md D-TBR-1, moved 2026-10-19 to ace384b4; D-TBR-11, moved 2026-10-26 to fcb7ddb3).
    "trace-bench @ git+https://github.com/alex-chadyuk/trace-bench@fcb7ddb303f7e70a2270b6d73e21eda40ae9cd52",
]

[project.optional-dependencies]
# the methods under test, pinned by commit (plans/rca-arms.md §2); installed into the env the run records name
baro = ["fse-baro @ git+https://github.com/phamquiluan/baro@e35f4ec1095e5cac891d52de9ad18a5b32a37ec8"]
rcaeval = ["RCAEval @ git+https://github.com/phamquiluan/RCAEval@259ea4167160256a74ad30004aa3d96a998c846e"]
# the CIRCA port's graph construction and head need causal-learn and networkx (plans/rca-arms.md, addendum 2026-10-25);
# RCAEval's own `default` extra (torch, tigramite, dvc, …) is not installed
circa = ["causal-learn>=0.1.4", "networkx>=3"]
# the PC-PageRank port's ranking head (plans/rca-arms.md, addendum 2026-10-28): the pin's own floor for its default mode
pagerank = ["scikit-network>=0.31.0"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools]
packages = ["tracebenchrca"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
